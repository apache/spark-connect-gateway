# Checks Cargo.lock against the RustSec advisory database.
#
# The advisory database changes daily, so a check that fails on *any* advisory
# would turn pull requests red for vulnerabilities they did not introduce --
# the same failure mode as a floating toolchain. The two questions are kept
# apart instead:
#
#   - Is main affected by a known advisory? The daily schedule (and
#     workflow_dispatch) runs a full `cargo audit` on main.
#   - Does this change introduce one? Pull requests that touch the dependency
#     set run dev/audit-new-advisories.sh, which fails only on advisories the
#     pull request's Cargo.lock has and its base's does not. Advisories already
#     on main are listed but not counted against the pull request.
#
# There is no push trigger: a merge is already checked as a pull request, and a
# full audit on push would mark every dependency merge red while main carries
# any unfixed advisory -- including merges that fix one.
#
# Advisories with no fixed release are ignored in .cargo/audit.toml, each
# naming the issue that tracks it.

name: Security audit

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
      - "dev/audit-new-advisories.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable

      # Installed from crates.io rather than through a third-party action, to
      # stay within the Apache GitHub Actions allowlist. Pinned so a new
      # cargo-audit release cannot change the result without a reviewed bump.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit main
        if: github.event_name != 'pull_request'
        run: cargo audit

      # Only the base revision's Cargo.lock is needed; fetch that one commit
      # rather than the full history.
      - name: Fetch base Cargo.lock
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:Cargo.lock" > "$RUNNER_TEMP/base.Cargo.lock"

      - name: Audit for advisories introduced by this pull request
        if: github.event_name == 'pull_request'
        run: dev/audit-new-advisories.sh "$RUNNER_TEMP/base.Cargo.lock" Cargo.lock
