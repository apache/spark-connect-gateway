# End-to-end tests on a real Kubernetes cluster (kind): each job builds the
# gateway image, deploys Spark Connect backends plus the gateway via the Helm
# chart, and drives a real PySpark client through it. The jobs differ in what
# they configure and assert -- baseline routing, JWT identity, the backend trust
# boundary, and per-tenant pool isolation -- and each runs its own cluster so
# they stay independent.
#
# kind and helm are installed with plain `curl` rather than third-party actions,
# both to keep the ASF GitHub Actions allowlist happy and to pin exact versions.

name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  HELM_VERSION: v4.2.4
  CLUSTER_NAME: scg-e2e
  NAMESPACE: spark-connect

jobs:
  e2e-smoke:
    name: e2e smoke (kind + Helm + PySpark)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -euo pipefail
          # Install into ~/.local/bin: writable without sudo, unlike /usr/local/bin
          # on the hosted runners.
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version
          "$HOME/.local/bin/helm" version --short
          kubectl version --client

      # Layer-cached across runs so a nightly that only changed manifests does not
      # pay for a full `cargo build --release` again.
      - name: Build the gateway image
        run: docker build -t scg:e2e .

      - name: Create the kind cluster
        run: kind create cluster --name "$CLUSTER_NAME" --wait 120s

      - name: Load the gateway image into kind
        run: kind load docker-image scg:e2e --name "$CLUSTER_NAME"

      - name: Deploy the Spark Connect backends
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" create namespace "$NAMESPACE"
          kubectl --context "kind-${CLUSTER_NAME}" apply \
            -f deploy/examples/e2e-smoke/spark-connect-server.yaml
          # First boot pulls the ~700 MiB upstream Spark image.
          # `rollout status`, not `wait --for=condition=ready pod`: a label-selector
          # wait fails outright with "no matching resources found" when the
          # ReplicaSet has not produced a pod yet, and --timeout does not cover
          # that window. Rollout completion already implies the readiness probe
          # passed, so this is the same guarantee without the race.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status \
            deployment/spark-connect-server -n "$NAMESPACE" --timeout=600s

      - name: Install the gateway via Helm
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" install scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-smoke/values.yaml
          # See the backend step: rollout status avoids the empty-selector race.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s

      - name: Verify the gateway discovered both backends
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            count=$(kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
              deploy/scg --tail=200 2>/dev/null \
              | grep -o '"message":"k8s pool: backend list updated","count":[0-9]*' \
              | tail -1 | grep -oE '[0-9]+$' || true)
            if [ "${count:-0}" = "2" ]; then
              echo "gateway sees 2 backends"
              exit 0
            fi
            sleep 2
          done
          echo "gateway never reported 2 backends" >&2
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=100 >&2
          exit 1

      - name: Run a PySpark client through the gateway
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e2e-venv
          # Pin PySpark to the same version as the backend image
          # (apache/spark:4.0.0). A newer client talks to an older server only up
          # to a point: pyspark 4.2's createDataFrame reads the SQL config
          # spark.sql.session.localRelationSizeLimit, which does not exist in
          # Spark 4.0, and the server answers SQL_CONF_NOT_FOUND.
          /tmp/e2e-venv/bin/pip install --quiet 'pyspark[connect]==4.0.0'
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done
          # The repo's own smoke client: asserts range().count(), an explicit-schema
          # createDataFrame round-trip, and follow-up queries on the same session.
          /tmp/e2e-venv/bin/python3 test/integration/client_smoke.py sc://localhost:15003

      - name: Verify metrics and audit output
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 9090:9090 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9090/metrics >/dev/null 2>&1 && break
            sleep 1
          done
          metrics=$(curl -fsS http://127.0.0.1:9090/metrics)
          echo "$metrics" | grep -E '^scg_backend_pool_size 2$'
          echo "$metrics" | grep -E '^scg_rpcs_total\{.*rpc="ExecutePlan".*\} [1-9]'
          # The audit sink logs one record per RPC; ExecutePlan must be among them.
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg \
            --tail=300 | grep -q '"rpc":"ExecutePlan"'

      - name: Gateway logs (on failure)
        if: failure()
        run: |
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" -o wide || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=200 || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            -l app=spark-connect-server --tail=100 || true
          kubectl --context "kind-${CLUSTER_NAME}" describe pods -n "$NAMESPACE" || true

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true

  e2e-auth-jwt:
    name: e2e auth-jwt (JWT identity + rejection paths)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: scg-e2e-authjwt
      JWT_SECRET: e2e-auth-jwt-walkthrough-secret-not-for-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the gateway image
        run: docker build -t scg:e2e .

      - name: Create the kind cluster and load the image
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kind load docker-image scg:e2e --name "$CLUSTER_NAME"

      - name: Deploy the Spark Connect backends
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" create namespace "$NAMESPACE"
          kubectl --context "kind-${CLUSTER_NAME}" apply \
            -f deploy/examples/e2e-auth-jwt/spark-connect-server.yaml
          # rollout status avoids the empty-selector race; see the e2e-smoke job.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status \
            deployment/spark-connect-server -n "$NAMESPACE" --timeout=600s

      - name: Install the gateway with auth.type=jwt
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" install scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-auth-jwt/values.yaml
          # See the backend step: rollout status avoids the empty-selector race.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s

      # The point of this walkthrough: the chart's auth block, which the
      # in-process tests never render.
      - name: Assert the chart rendered the JWT auth config
        run: |
          set -euo pipefail
          cfg=$(kubectl --context "kind-${CLUSTER_NAME}" get configmap scg-config \
            -n "$NAMESPACE" -o jsonpath='{.data.config\.yaml}')
          echo "$cfg" | grep -qE '^\s+type: jwt'
          echo "$cfg" | grep -qE '^\s+issuer: "scg-e2e-issuer"'
          echo "$cfg" | grep -qE '^\s+tenant_claim: "tenant"'
          echo "$cfg" | grep -qE '^\s+groups_claim: "groups"'
          echo "chart rendered auth.type=jwt with the expected claim mapping"

      - name: Drive PySpark with a valid JWT and check the audit identity
        run: |
          set -euo pipefail
          cat > /tmp/sign-jwt.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SECRET="$1"; CLAIMS="$2"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          H=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          P=$(printf '%s' "$CLAIMS" | b64url)
          SIG=$(printf '%s' "$H.$P" | openssl dgst -sha256 -hmac "$SECRET" -binary | b64url)
          printf '%s.%s.%s\n' "$H" "$P" "$SIG"
          SH
          chmod +x /tmp/sign-jwt.sh

          python3 -m venv /tmp/e2e-venv
          # Pinned to the backend image's Spark version; see the e2e-smoke job.
          /tmp/e2e-venv/bin/pip install --quiet 'pyspark[connect]==4.0.0'

          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done

          now=$(date +%s)
          token=$(/tmp/sign-jwt.sh "$JWT_SECRET" \
            "{\"sub\":\"alice\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$((now+600)),\"iat\":$now,\"tenant\":\"team-a\",\"groups\":[\"devs\",\"admins\"]}")
          /tmp/e2e-venv/bin/python3 - "$token" <<'PY'
          import sys
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote(f"sc://localhost:15003/;token={sys.argv[1]}").getOrCreate()
          assert s.range(10).count() == 10
          s.stop()
          print("valid JWT accepted")
          PY

          # The sub/tenant/groups claims must reach the audit pipeline: user_id
          # has to be alice, not anonymous.
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg \
            --tail=200 | grep '"event":"session.create"' | tail -1 > /tmp/audit.json
          python3 - <<'PY'
          import json
          f = json.load(open("/tmp/audit.json"))["fields"]
          assert f["user_id"] == "alice", f
          assert f["tenant"] == "team-a", f
          assert f["groups"] == "devs,admins", f
          print("audit identity:", f["user_id"], f["tenant"], f["groups"])
          PY

      - name: Drive the rejection paths
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done

          # One case per process, on purpose: SparkSession.getOrCreate() returns a
          # cached session, so running several attempts in one interpreter would
          # silently reuse the first URL's credentials and never exercise the
          # later cases.
          cat > /tmp/expect_reject.py <<'PY'
          import sys
          from pyspark.sql import SparkSession

          url, want_status, want_detail = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              SparkSession.builder.remote(url).getOrCreate().range(1).count()
          except Exception as e:
              err = str(e)
          else:
              raise SystemExit(f"expected rejection, got success for {url[:40]}...")
          assert want_status in err, f"want {want_status} in: {err[:300]}"
          assert want_detail in err, f"want {want_detail!r} in: {err[:300]}"
          print(f"OK rejected: {want_detail}")
          PY

          now=$(date +%s); past=$((now - 7200))
          expired=$(/tmp/sign-jwt.sh "$JWT_SECRET" \
            "{\"sub\":\"alice\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$past,\"iat\":$((past-100))}")
          wrong=$(/tmp/sign-jwt.sh "wrong-secret" \
            "{\"sub\":\"alice\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$((now+600)),\"iat\":$now}")

          # Both signature-validation failures must report the SAME generic
          # message: distinguishing "expired" from "bad signature" tells an
          # attacker which half to work on.
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py \
            "sc://localhost:15003/;token=$expired" UNAUTHENTICATED "invalid JWT"
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py \
            "sc://localhost:15003/;token=$wrong" UNAUTHENTICATED "invalid JWT"
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py \
            "sc://localhost:15003" UNAUTHENTICATED \
            "missing or malformed Authorization: Bearer header"

      - name: Assert the failures were audited and counted
        run: |
          set -euo pipefail
          # The audit reasons are a small fixed set and must not leak specifics.
          reasons=$(kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            deploy/scg --tail=400 | grep '"event":"auth.failure"' \
            | grep -oE '"reason":"[a-z_]+"' | sort -u)
          echo "$reasons"
          echo "$reasons" | grep -q '"reason":"invalid_token"'
          echo "$reasons" | grep -q '"reason":"missing_token"'

          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 9090:9090 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9090/metrics >/dev/null 2>&1 && break
            sleep 1
          done
          metrics=$(curl -fsS http://127.0.0.1:9090/metrics)
          echo "$metrics" | grep -E '^scg_auth_failures_total\{reason="invalid_token"\} [1-9]'
          echo "$metrics" | grep -E '^scg_auth_failures_total\{reason="missing_token"\} [1-9]'

      - name: Gateway logs (on failure)
        if: failure()
        run: |
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" -o wide || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=200 || true
          kubectl --context "kind-${CLUSTER_NAME}" describe pods -n "$NAMESPACE" || true

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true

  e2e-trust-boundary:
    name: e2e trust-boundary (backend token enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: scg-e2e-trustb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the gateway image
        run: docker build -t scg:e2e .

      - name: Create the kind cluster and load the image
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kind load docker-image scg:e2e --name "$CLUSTER_NAME"

      - name: Deploy the token-enforcing backend
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" create namespace "$NAMESPACE"
          # One Secret, read by both sides: the backend enforces the token, the
          # gateway presents it.
          kubectl --context "kind-${CLUSTER_NAME}" -n "$NAMESPACE" create secret \
            generic scg-backend-token --from-literal=token="$(openssl rand -hex 32)"
          kubectl --context "kind-${CLUSTER_NAME}" apply \
            -f deploy/examples/e2e-trust-boundary/spark-connect-server.yaml
          # rollout status avoids the empty-selector race; see the e2e-smoke job.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status \
            deployment/spark-connect-server -n "$NAMESPACE" --timeout=600s

      - name: Install PySpark
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e2e-venv
          # Pinned to the backend image's Spark version; see the e2e-smoke job.
          /tmp/e2e-venv/bin/pip install --quiet 'pyspark[connect]==4.0.0'
          # One case per process: getOrCreate() caches sessions, so reusing one
          # interpreter across URLs would silently reuse the first connection.
          cat > /tmp/expect_reject.py <<'PY'
          import sys
          from pyspark.sql import SparkSession

          url, want_status, want_detail = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              SparkSession.builder.remote(url).getOrCreate().range(1).count()
          except Exception as e:
              err = str(e)
          else:
              raise SystemExit(f"expected rejection, got success for {url[:40]}")
          assert want_status in err, f"want {want_status} in: {err[:300]}"
          assert want_detail in err, f"want {want_detail!r} in: {err[:300]}"
          print(f"OK rejected: {want_detail}")
          PY

      # Assertion 1: the backend refuses anything that reaches it without the
      # token — the port-forward stands in for "any pod that can dial the Service".
      # This runs before the gateway exists, so nothing can be presenting a token.
      - name: 'Assertion 1: a direct connection to the backend is refused'
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/spark-connect 15002:15002 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15002) >/dev/null 2>&1 && break
            sleep 1
          done
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py "sc://localhost:15002" \
            UNAUTHENTICATED "No authentication token provided"

      - name: Install the gateway with the backend token
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" install scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-trust-boundary/values.yaml
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg \
            --tail=50 | grep -q '"message":"outbound backend authentication enabled"'

      - name: 'Assertion 2: the same client succeeds through the gateway'
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done
          /tmp/e2e-venv/bin/python3 -c "
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote('sc://localhost:15003').getOrCreate()
          assert s.range(10).count() == 10
          s.stop()
          print('OK: query succeeded through the gateway')
          "

      # Assertion 3 is the negative control: same gateway, same client, only the
      # token removed. If this still succeeded, assertion 2 would prove nothing.
      - name: 'Assertion 3: a tokenless gateway is refused too'
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" upgrade scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-trust-boundary/values.yaml \
            --set backendToken.enabled=false
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py "sc://localhost:15003" \
            UNAUTHENTICATED "No authentication token provided"

      # Assertion 4: the token layer only holds while clients cannot read the token
      # back, so the gateway withholds it from Config responses.
      - name: 'Assertion 4: the token cannot be read back through the gateway'
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" upgrade scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-trust-boundary/values.yaml
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done
          /tmp/e2e-venv/bin/python3 -c "
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote('sc://localhost:15003').getOrCreate()
          tok = s.conf.get('spark.connect.authenticate.token', '<unset>')
          print('token via gateway =', tok)
          assert tok in (None, '<unset>'), f'TOKEN LEAKED: {tok!r}'
          s.stop()
          print('OK: token withheld from the Config RPC')
          "
          # The withholding is auditable.
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg \
            --tail=300 | grep -q '"event":"config.redacted"'

      - name: Gateway logs (on failure)
        if: failure()
        run: |
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" -o wide || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=200 || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            -l app=spark-connect-server --tail=100 || true
          kubectl --context "kind-${CLUSTER_NAME}" describe pods -n "$NAMESPACE" || true

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true

  e2e-multitenant:
    name: e2e multitenant (per-tenant pool routing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: scg-e2e-mtenant
      JWT_SECRET: e2e-multitenant-walkthrough-secret-not-for-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the gateway image
        run: docker build -t scg:e2e .

      - name: Create the kind cluster and load the image
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kind load docker-image scg:e2e --name "$CLUSTER_NAME"

      # Two independent Spark Connect Deployments + Services, one per tenant, so
      # each tenant's pool has exactly one backend IP and the audit log's
      # `backend` field names the tenant unambiguously.
      - name: Deploy the two per-tenant Spark Connect backends
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" create namespace "$NAMESPACE"
          kubectl --context "kind-${CLUSTER_NAME}" apply \
            -f deploy/examples/e2e-multitenant/spark-connect-server.yaml
          # See the other jobs: rollout status avoids the empty-selector race.
          # One call per tenant Deployment; both must finish rolling out.
          for team in team-a team-b; do
            kubectl --context "kind-${CLUSTER_NAME}" rollout status \
              "deployment/spark-connect-${team}" -n "$NAMESPACE" --timeout=600s
          done

      - name: Record each tenant's backend endpoint
        run: |
          set -euo pipefail
          for team in team-a team-b; do
            ip=$(kubectl --context "kind-${CLUSTER_NAME}" get endpointslices \
              -n "$NAMESPACE" \
              -l "kubernetes.io/service-name=spark-connect-${team}" \
              -o jsonpath='{.items[0].endpoints[0].addresses[0]}')
            test -n "$ip"
            # Env var names cannot contain a hyphen, so team-a becomes TEAM_A.
            echo "BACKEND_${team//-/_}=${ip}:15002" | tr '[:lower:]' '[:upper:]' \
              >> "$GITHUB_ENV"
            echo "${team} backend = ${ip}:15002"
          done

      - name: Install the gateway with per-tenant pool overrides
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" install scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-multitenant/values.yaml
          # See the backend step: rollout status avoids the empty-selector race.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s

      # The chart's tenantPools.overrides templating and the strict-mode
      # "no default pool" path are rendered nowhere else in CI.
      - name: Assert the chart rendered both tenant pool overrides
        run: |
          set -euo pipefail
          cfg=$(kubectl --context "kind-${CLUSTER_NAME}" get configmap scg-config \
            -n "$NAMESPACE" -o jsonpath='{.data.config\.yaml}')
          echo "$cfg" | grep -qE '^\s+on_unknown_tenant: "reject"'
          echo "$cfg" | grep -qE '^\s+service_name: "spark-connect-team-a"'
          echo "$cfg" | grep -qE '^\s+service_name: "spark-connect-team-b"'
          echo "$cfg" | grep -qE '^\s+source: from_claim'
          echo "$cfg" | grep -qE '^\s+on_missing: "reject"'
          echo "chart rendered both tenant overrides under the reject policy"

      # One K8s Endpoints watcher per override pool, and no default pool at all.
      - name: Assert the gateway started one watcher per tenant pool
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            logs=$(kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
              deploy/scg --tail=200 2>/dev/null || true)
            ready=$(echo "$logs" \
              | grep -c '"message":"tenant override pool ready"' || true)
            pools=$(echo "$logs" \
              | grep -c '"message":"k8s pool: backend list updated","count":1' || true)
            if [ "$ready" -ge 2 ] && [ "$pools" -ge 2 ]; then
              echo "$logs" | grep -q 'no default pool configured'
              echo "two tenant pools ready, each with one backend, no default pool"
              exit 0
            fi
            sleep 2
          done
          echo "tenant pools never became ready" >&2
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=100 >&2
          exit 1

      - name: Install PySpark and the JWT signer
        run: |
          set -euo pipefail
          cat > /tmp/sign-jwt.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          SECRET="$1"; CLAIMS="$2"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          H=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          P=$(printf '%s' "$CLAIMS" | b64url)
          SIG=$(printf '%s' "$H.$P" | openssl dgst -sha256 -hmac "$SECRET" -binary | b64url)
          printf '%s.%s.%s\n' "$H" "$P" "$SIG"
          SH
          chmod +x /tmp/sign-jwt.sh
          python3 -m venv /tmp/e2e-venv
          # Pinned to the backend image's Spark version; see the e2e-smoke job.
          /tmp/e2e-venv/bin/pip install --quiet 'pyspark[connect]==4.0.0'
          # One case per process: getOrCreate() caches sessions, so reusing one
          # interpreter across tokens would silently reuse the first identity.
          cat > /tmp/expect_reject.py <<'PY'
          import sys
          from pyspark.sql import SparkSession

          url, want_status, want_detail = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              SparkSession.builder.remote(url).getOrCreate().range(1).count()
          except Exception as e:
              err = str(e)
          else:
              raise SystemExit(f"expected rejection, got success for {url[:40]}")
          assert want_status in err, f"want {want_status} in: {err[:300]}"
          assert want_detail in err, f"want {want_detail!r} in: {err[:300]}"
          print(f"OK rejected: {want_detail}")
          PY

      # The core assertion: two tenants, two JWTs, two pools. Each session must
      # land on its own tenant's pod and never the other's. Both queries also
      # have to actually succeed — routing to the right pool is only meaningful
      # if the RPC completes against a real Spark backend.
      - name: 'Assertion 1: each tenant is routed to its own backend pool'
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done

          now=$(date +%s)
          for pair in "alice:team-a:engineers" "bob:team-b:analysts"; do
            user=${pair%%:*}; rest=${pair#*:}
            tenant=${rest%%:*}; group=${rest#*:}
            token=$(/tmp/sign-jwt.sh "$JWT_SECRET" \
              "{\"sub\":\"$user\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$((now+900)),\"iat\":$now,\"tenant\":\"$tenant\",\"groups\":[\"$group\"]}")
            /tmp/e2e-venv/bin/python3 - "$token" "$user" <<'PY'
          import sys
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote(
              f"sc://localhost:15003/;token={sys.argv[1]}").getOrCreate()
          assert s.range(10).count() == 10
          s.stop()
          print(f"{sys.argv[2]}: query succeeded through the gateway")
          PY
          done

          # The audit log is what proves isolation: the `backend` recorded for
          # each tenant must be that tenant's own Endpoint, captured earlier.
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg \
            --tail=300 | grep '"event":"session.create"' > /tmp/sessions.jsonl
          python3 - <<PY
          import json

          want = {"team-a": "${BACKEND_TEAM_A}", "team-b": "${BACKEND_TEAM_B}"}
          assert all(want.values()), f"backend IPs not captured: {want}"
          seen = {}
          for line in open("/tmp/sessions.jsonl"):
              f = json.loads(line)["fields"]
              seen.setdefault(f["tenant"], set()).add(f["backend"])
          print("tenant -> backends:", {k: sorted(v) for k, v in seen.items()})
          assert set(seen) == set(want), f"tenants {sorted(seen)} != {sorted(want)}"
          for tenant, backends in seen.items():
              assert backends == {want[tenant]}, (
                  f"{tenant} reached {sorted(backends)}, expected {want[tenant]}")
          users = {json.loads(l)["fields"]["user_id"] for l in open("/tmp/sessions.jsonl")}
          assert users == {"alice", "bob"}, users
          print("each tenant reached only its own pool")
          PY

      # Both rejects are rendered by the same config, but they are different
      # mechanisms and must not collapse into one status code: an unknown tenant
      # is authenticated-but-not-permitted, a missing claim never identified a
      # tenant at all.
      - name: 'Assertion 2: unknown and missing tenants are rejected differently'
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done

          now=$(date +%s)
          ghost=$(/tmp/sign-jwt.sh "$JWT_SECRET" \
            "{\"sub\":\"mallory\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$((now+900)),\"iat\":$now,\"tenant\":\"team-ghost\"}")
          notenant=$(/tmp/sign-jwt.sh "$JWT_SECRET" \
            "{\"sub\":\"nobody\",\"iss\":\"scg-e2e-issuer\",\"aud\":\"scg\",\"exp\":$((now+900)),\"iat\":$now}")

          # Valid signature, but the tenant has no pool -> PermissionDenied.
          # The status name is grpc's own enum spelling (StatusCode.PERMISSION_DENIED),
          # the same form the auth-jwt job matches UNAUTHENTICATED on.
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py \
            "sc://localhost:15003/;token=$ghost" PERMISSION_DENIED \
            'tenant "team-ghost" has no configured pool'
          # Valid signature, no tenant claim at all -> Unauthenticated.
          /tmp/e2e-venv/bin/python3 /tmp/expect_reject.py \
            "sc://localhost:15003/;token=$notenant" UNAUTHENTICATED \
            "tenant required but not provided"

      # A reject that is not recorded is not enforcement an operator can see.
      - name: 'Assertion 3: the rejects were audited and counted'
        run: |
          set -euo pipefail
          logs=$(kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            deploy/scg --tail=500)

          # Only the two successful sessions bound a backend; neither reject did.
          test "$(echo "$logs" | grep -c '"event":"session.create"')" = 2

          # Unknown tenant surfaces as rpc.error; a missing claim is an auth
          # failure with its own reason. Different events, on purpose.
          echo "$logs" | grep '"event":"rpc.error"' \
            | grep -q 'tenant \\"team-ghost\\" has no configured pool'
          echo "$logs" | grep '"event":"auth.failure"' \
            | grep -q '"reason":"missing_tenant"'

          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 9090:9090 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9090/metrics >/dev/null 2>&1 && break
            sleep 1
          done
          metrics=$(curl -fsS http://127.0.0.1:9090/metrics)
          echo "$metrics" | grep -E '^scg_auth_failures_total\{reason="missing_tenant"\} [1-9]'
          echo "$metrics" | grep -E '^scg_rpcs_total\{code="PermissionDenied".*\} [1-9]'
          # Documented behaviour: the unlabelled gauge tracks the default pool
          # only, and strict multi-tenant mode has no default pool. A non-zero
          # value here would mean a default pool got configured after all.
          echo "$metrics" | grep -E '^scg_backend_pool_size 0$'
          echo "rejects audited and counted"

      - name: Gateway logs (on failure)
        if: failure()
        run: |
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" -o wide || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" deploy/scg --tail=200 || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            -l app=spark-connect-team-a --tail=100 || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            -l app=spark-connect-team-b --tail=100 || true
          kubectl --context "kind-${CLUSTER_NAME}" describe pods -n "$NAMESPACE" || true

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true

  e2e-multi-replica-redis:
    name: e2e multi-replica (Redis affinity store)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: scg-e2e-redis
      # Fixed so the Redis key is predictable; PySpark would generate a random one.
      # Must be a canonical v4 UUID: PySpark validates the session_id parameter
      # with uuid.UUID(s, version=4), which rewrites the version/variant nibbles
      # rather than rejecting a non-v4 string -- so a sloppy id would still be
      # accepted but no longer match what we build the Redis key from here.
      SESSION_ID: aaaaaaaa-bbbb-4ccc-9ddd-eeeeeeeeeeee
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the gateway image
        run: docker build -t scg:e2e .

      - name: Create the kind cluster and load the image
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kind load docker-image scg:e2e --name "$CLUSTER_NAME"

      - name: Deploy the Spark Connect backends
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" create namespace "$NAMESPACE"
          kubectl --context "kind-${CLUSTER_NAME}" apply \
            -f deploy/examples/e2e-multi-replica-redis/spark-connect-server.yaml
          # rollout status avoids the empty-selector race; see the e2e-smoke job.
          kubectl --context "kind-${CLUSTER_NAME}" rollout status \
            deployment/spark-connect-server -n "$NAMESPACE" --timeout=600s

      # Two gateway replicas plus the chart's bundled Redis StatefulSet. This is
      # the only job that renders the chart's Redis topology (StatefulSet + PVC +
      # Service + the synthesized redis:// URL).
      - name: Install the gateway with 2 replicas and bundled Redis
        run: |
          set -euo pipefail
          helm --kube-context "kind-${CLUSTER_NAME}" install scg ./deploy/helm/scg \
            -n "$NAMESPACE" -f deploy/examples/e2e-multi-replica-redis/values.yaml
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s
          kubectl --context "kind-${CLUSTER_NAME}" rollout status statefulset/scg-redis \
            -n "$NAMESPACE" --timeout=300s
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE"

      # Both replicas must have chosen the Redis store. `memory` here would mean
      # values.yaml did not take effect, and every later assertion would be
      # meaningless -- a memory store cannot share anything across replicas.
      - name: 'Assertion 1: both replicas use the Redis affinity store'
        run: |
          set -euo pipefail
          pods=$(kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/name=scg,app.kubernetes.io/component=gateway \
            -o jsonpath='{.items[*].metadata.name}')
          # Guard against the selector matching nothing (or the Redis pod), which
          # would let the loop below pass without checking anything.
          count=$(echo "$pods" | wc -w)
          test "$count" -eq 2 || {
            echo "expected 2 gateway pods, got $count: $pods" >&2
            kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" \
              --show-labels >&2
            exit 1
          }
          for p in $pods; do
            kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" "$p" \
              --tail=50 | grep -q '"affinity_store":"redis"'
            echo "$p: affinity_store=redis"
          done

      - name: Install PySpark
        run: |
          set -euo pipefail
          python3 -m venv /tmp/e2e-venv
          # Pinned to the backend image's Spark version; see the e2e-smoke job.
          /tmp/e2e-venv/bin/pip install --quiet 'pyspark[connect]==4.0.0'

      # Bind a session through the Service (either replica), then read the binding
      # straight out of Redis: it proves the state left the pod, which is the whole
      # point of the Redis store.
      - name: 'Assertion 2: the session binding is written to Redis'
        run: |
          set -euo pipefail
          # Nothing may pre-exist, or a stale key could satisfy the assertions below.
          test -z "$(kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
            statefulset/scg-redis -- redis-cli KEYS 'scg:s:*' | tr -d '\r')"

          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done

          # A fixed session_id keeps the Redis key predictable. PySpark accepts one
          # via the session_id URL parameter.
          /tmp/e2e-venv/bin/python3 - "$SESSION_ID" <<'PY'
          import sys
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote(
              f"sc://localhost:15003/;session_id={sys.argv[1]}").getOrCreate()
          assert s.range(10).count() == 10
          s.range(50).createOrReplaceTempView("t")
          assert s.sql("SELECT count(*) FROM t").collect()[0][0] == 50
          print("query and temp view succeeded through the gateway")
          PY

          key="scg:s:default|anonymous|${SESSION_ID}"
          backend=$(kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
            statefulset/scg-redis -- redis-cli GET "$key" | tr -d '\r')
          test -n "$backend"
          # The value must be one of the real backend pod IPs, not any old string.
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" \
            -l app=spark-connect-server \
            -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}' > /tmp/ips
          grep -qx "${backend%:15002}" /tmp/ips
          ttl=$(kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
            statefulset/scg-redis -- redis-cli TTL "$key" | tr -d '\r')
          test "$ttl" -gt 0 -a "$ttl" -le 3600
          echo "BOUND_BACKEND=$backend" >> "$GITHUB_ENV"
          echo "binding in Redis: $key -> $backend (ttl ${ttl}s)"

      # The claim that matters: kill the replica that owns nothing, and a client
      # arriving at the REPLACEMENT pod still reaches the original backend. A
      # memory store could not do this -- the binding died with the pod.
      - name: 'Assertion 3: affinity survives a replica being killed'
        run: |
          set -euo pipefail
          before=$(kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/name=scg,app.kubernetes.io/component=gateway \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl --context "kind-${CLUSTER_NAME}" delete pod -n "$NAMESPACE" "$before"
          kubectl --context "kind-${CLUSTER_NAME}" rollout status deployment/scg \
            -n "$NAMESPACE" --timeout=300s

          # The newest pod is the replacement; it has never seen this session.
          new=$(kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/name=scg,app.kubernetes.io/component=gateway \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')
          test "$new" != "$before"
          echo "killed $before, replacement is $new"

          key="scg:s:default|anonymous|${SESSION_ID}"
          after=$(kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
            statefulset/scg-redis -- redis-cli GET "$key" | tr -d '\r')
          test "$after" = "$BOUND_BACKEND"
          echo "binding unchanged after the restart: $after"

          # Forward to the replacement pod DIRECTLY (not the Service) so the RPC
          # cannot be served by the surviving replica.
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            "pod/$new" 15004:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15004) >/dev/null 2>&1 && break
            sleep 1
          done
          /tmp/e2e-venv/bin/python3 - "$SESSION_ID" <<'PY'
          import sys
          from pyspark.sql import SparkSession
          s = SparkSession.builder.remote(
              f"sc://localhost:15004/;session_id={sys.argv[1]}").getOrCreate()
          assert s.range(4).count() == 4
          print("replacement replica served the same session")
          PY

          # The replacement's own log must name the original backend: it could only
          # have learned that address from Redis. Matched on the forwarding message
          # rather than a specific rpc name -- which RPC carries the query is a
          # client-version detail. Unary RPCs log "forwarding" and streaming ones
          # log "forwarding stream", so accept either; both carry session and addr.
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" "$new" \
            --tail=300 | grep -E '"message":"forwarding( stream)?"' \
            | grep -q "\"session\":\"${SESSION_ID}\".*\"addr\":\"${BOUND_BACKEND}\""
          echo "replacement replica routed to $BOUND_BACKEND, read from Redis"

      # Without this, assertion 3 could pass on a gateway that always picks the
      # same backend regardless of affinity. Fresh sessions must be free to land
      # on either pod, so pinning is a property of the binding, not of the pool.
      - name: 'Assertion 4: fresh sessions are not pinned to that backend'
        run: |
          set -euo pipefail
          kubectl --context "kind-${CLUSTER_NAME}" port-forward -n "$NAMESPACE" \
            svc/scg 15003:15003 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15003) >/dev/null 2>&1 && break
            sleep 1
          done
          for i in $(seq 1 8); do
            /tmp/e2e-venv/bin/python3 - "$i" <<'PY' || true
          import sys
          from pyspark.sql import SparkSession
          sid = f"ffffffff-0000-4000-8000-{int(sys.argv[1]):012d}"
          s = SparkSession.builder.remote(
              f"sc://localhost:15003/;session_id={sid}").getOrCreate()
          s.range(2).count()
          PY
          done
          distinct=$(for k in $(kubectl --context "kind-${CLUSTER_NAME}" exec \
              -n "$NAMESPACE" statefulset/scg-redis -- \
              redis-cli KEYS 'scg:s:default|anonymous|ffffffff-*' | tr -d '\r'); do
            kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
              statefulset/scg-redis -- redis-cli GET "$k" | tr -d '\r'
          done | sort -u | wc -l)
          echo "fresh sessions spread over $distinct distinct backends"
          test "$distinct" -eq 2

      - name: Gateway and Redis logs (on failure)
        if: failure()
        run: |
          kubectl --context "kind-${CLUSTER_NAME}" get pods -n "$NAMESPACE" -o wide --show-labels || true
          kubectl --context "kind-${CLUSTER_NAME}" logs -n "$NAMESPACE" \
            -l app.kubernetes.io/name=scg --tail=200 --prefix || true
          kubectl --context "kind-${CLUSTER_NAME}" exec -n "$NAMESPACE" \
            statefulset/scg-redis -- redis-cli KEYS 'scg:*' || true
          kubectl --context "kind-${CLUSTER_NAME}" get pvc -n "$NAMESPACE" || true
          kubectl --context "kind-${CLUSTER_NAME}" describe pods -n "$NAMESPACE" || true

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true
