apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scg.fullname" . }}-config
  labels:
    {{- include "scg.gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    bind_addr: ":{{ .Values.service.grpcPort }}"
    admin_addr: ":{{ .Values.service.adminPort }}"

    {{- /* ---- backend discovery ----
         backendDiscovery may be omitted (set to null) only when
         tenantPools.onUnknownTenant is "reject" and at least one
         tenant override is configured — in that mode the default
         pool is never selected. The gateway binary enforces the
         same rule at startup. */}}
    {{- if .Values.backendDiscovery }}
    {{- if eq .Values.backendDiscovery.type "static" }}
    backends:
      {{- range .Values.backendDiscovery.static.addresses }}
      - {{ . | quote }}
      {{- end }}
    {{- else if eq .Values.backendDiscovery.type "k8s" }}
    backend_discovery:
      type: k8s
      namespace: {{ .Values.backendDiscovery.k8s.namespace | quote }}
      service_name: {{ .Values.backendDiscovery.k8s.serviceName | quote }}
      port: {{ .Values.backendDiscovery.k8s.port }}
    {{- else }}
    {{- fail (printf "backendDiscovery.type must be 'static' or 'k8s', got %q" .Values.backendDiscovery.type) }}
    {{- end }}
    {{- else if not (and (eq .Values.tenantPools.onUnknownTenant "reject") .Values.tenantPools.overrides) }}
    {{- fail "backendDiscovery may only be omitted when tenantPools.onUnknownTenant is \"reject\" and tenantPools.overrides is non-empty" }}
    {{- end }}

    {{- /* ---- backend token (gateway→backend auth) ----
         The token values live in Secrets and reach the gateway as
         env vars (see deployment.yaml); the config only names the
         env var, so no credential lands in this ConfigMap. */}}
    {{- if .Values.backendToken.enabled }}
    {{- if and (not .Values.backendToken.secretName) (not .Values.backendToken.tenantOverrides) }}
    {{- fail "backendToken.enabled requires backendToken.secretName and/or backendToken.tenantOverrides" }}
    {{- end }}
    {{- range $tenant, $_ := .Values.backendToken.tenantOverrides }}
    {{- if not (hasKey $.Values.tenantPools.overrides $tenant) }}
    {{- fail (printf "backendToken.tenantOverrides.%s has no matching tenantPools.overrides entry (a per-tenant token belongs to that tenant's own pool)" $tenant) }}
    {{- end }}
    {{- end }}
    {{- if .Values.backendToken.secretName }}
    backend_token:
      kind: env
      name: SCG_BACKEND_TOKEN
    {{- end }}
    {{- end }}

    {{- /* ---- auth ---- */}}
    {{- if eq .Values.auth.type "none" }}
    auth:
      type: none
    {{- else if eq .Values.auth.type "static" }}
    auth:
      type: static
      tokens:
        {{- range .Values.auth.static.tokens }}
        - token: {{ .token | quote }}
          user_id: {{ .userId | quote }}
          {{- if .tenant }}
          tenant: {{ .tenant | quote }}
          {{- end }}
          {{- if .groups }}
          groups:
            {{- range .groups }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
    {{- else if eq .Values.auth.type "jwt" }}
    auth:
      type: jwt
      algorithms:
        {{- range .Values.auth.jwt.algorithms }}
        - {{ . | quote }}
        {{- end }}
      {{- if .Values.auth.jwt.issuer }}
      issuer: {{ .Values.auth.jwt.issuer | quote }}
      {{- end }}
      {{- if .Values.auth.jwt.audience }}
      audience: {{ .Values.auth.jwt.audience | quote }}
      {{- end }}
      user_id_claim: {{ .Values.auth.jwt.userIdClaim | quote }}
      {{- if .Values.auth.jwt.tenantClaim }}
      tenant_claim: {{ .Values.auth.jwt.tenantClaim | quote }}
      {{- end }}
      {{- if .Values.auth.jwt.groupsClaim }}
      groups_claim: {{ .Values.auth.jwt.groupsClaim | quote }}
      {{- end }}
      key:
        {{- if eq .Values.auth.jwt.key.kind "pemFile" }}
        kind: pem_file
        path: {{ required "auth.jwt.key.path required when kind=pemFile" .Values.auth.jwt.key.path | quote }}
        {{- else if eq .Values.auth.jwt.key.kind "pemInline" }}
        kind: pem_inline
        pem: |
          {{- required "auth.jwt.key.pem required when kind=pemInline" .Values.auth.jwt.key.pem | nindent 10 }}
        {{- else if eq .Values.auth.jwt.key.kind "hmacSecret" }}
        kind: hmac_secret
        secret: {{ required "auth.jwt.key.secret required when kind=hmacSecret" .Values.auth.jwt.key.secret | quote }}
        {{- else }}
        {{- fail (printf "auth.jwt.key.kind must be pemFile|pemInline|hmacSecret, got %q" .Values.auth.jwt.key.kind) }}
        {{- end }}
    {{- else if eq .Values.auth.type "oidc" }}
    auth:
      type: oidc
      algorithms:
        {{- range .Values.auth.oidc.algorithms }}
        - {{ . | quote }}
        {{- end }}
      {{- if .Values.auth.oidc.issuer }}
      issuer: {{ .Values.auth.oidc.issuer | quote }}
      {{- end }}
      {{- if .Values.auth.oidc.audience }}
      audience: {{ .Values.auth.oidc.audience | quote }}
      {{- end }}
      {{- if .Values.auth.oidc.discoveryUrl }}
      discovery_url: {{ .Values.auth.oidc.discoveryUrl | quote }}
      {{- end }}
      {{- if .Values.auth.oidc.jwksUrl }}
      jwks_url: {{ .Values.auth.oidc.jwksUrl | quote }}
      {{- end }}
      user_id_claim: {{ .Values.auth.oidc.userIdClaim | quote }}
      {{- if .Values.auth.oidc.tenantClaim }}
      tenant_claim: {{ .Values.auth.oidc.tenantClaim | quote }}
      {{- end }}
      {{- if .Values.auth.oidc.groupsClaim }}
      groups_claim: {{ .Values.auth.oidc.groupsClaim | quote }}
      {{- end }}
      refresh_floor_secs: {{ .Values.auth.oidc.refreshFloorSecs }}
    {{- else }}
    {{- fail (printf "auth.type must be none|static|jwt|oidc, got %q" .Values.auth.type) }}
    {{- end }}

    {{- /* ---- affinity store ---- */}}
    {{- if eq .Values.affinityStore.type "memory" }}
    {{- if gt (int .Values.replicaCount) 1 }}
    {{- fail "replicaCount > 1 requires affinityStore.type: redis (memory store is per-pod and breaks session affinity across replicas)" }}
    {{- end }}
    affinity_store:
      type: memory
    {{- else if eq .Values.affinityStore.type "redis" }}
    affinity_store:
      type: redis
      url: {{ include "scg.redis.url" . | quote }}
      key_prefix: {{ .Values.affinityStore.redis.keyPrefix | quote }}
      session_ttl_secs: {{ .Values.affinityStore.redis.sessionTtlSecs }}
      op_ttl_secs: {{ .Values.affinityStore.redis.opTtlSecs }}
    {{- else }}
    {{- fail (printf "affinityStore.type must be memory|redis, got %q" .Values.affinityStore.type) }}
    {{- end }}

    {{- /* ---- rate limit ---- */}}
    {{- if .Values.rateLimit.enabled }}
    rate_limit:
      enabled: true
      store: {{ default "memory" .Values.rateLimit.store }}
      {{- if eq (default "memory" .Values.rateLimit.store) "redis" }}
      redis:
        url: {{ .Values.rateLimit.redis.url | quote }}
        key_prefix: {{ .Values.rateLimit.redis.keyPrefix | quote }}
        key_ttl_secs: {{ .Values.rateLimit.redis.keyTtlSecs }}
        on_failure: {{ .Values.rateLimit.redis.onFailure | quote }}
      {{- end }}
      default:
        rpcs_per_second: {{ .Values.rateLimit.default.rpcsPerSecond }}
        burst: {{ .Values.rateLimit.default.burst }}
        per_user_rpcs_per_second: {{ .Values.rateLimit.default.perUserRpcsPerSecond }}
        per_user_burst: {{ .Values.rateLimit.default.perUserBurst }}
      {{- if .Values.rateLimit.overrides }}
      overrides:
        {{- range $tenant, $bucket := .Values.rateLimit.overrides }}
        {{ $tenant | quote }}:
          rpcs_per_second: {{ $bucket.rpcsPerSecond }}
          burst: {{ $bucket.burst }}
          {{- if $bucket.perUserRpcsPerSecond }}
          per_user_rpcs_per_second: {{ $bucket.perUserRpcsPerSecond }}
          {{- end }}
          {{- if $bucket.perUserBurst }}
          per_user_burst: {{ $bucket.perUserBurst }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- /* ---- tenant pools (overrides + fallback) ---- */}}
    tenant_pools:
      on_unknown_tenant: {{ .Values.tenantPools.onUnknownTenant | quote }}
      {{- if .Values.tenantPools.overrides }}
      overrides:
        {{- range $tenant, $disc := .Values.tenantPools.overrides }}
        {{ $tenant | quote }}:
          {{- if eq $disc.type "static" }}
          type: static
          addresses:
            {{- range $disc.addresses }}
            - {{ . | quote }}
            {{- end }}
          {{- else if eq $disc.type "k8s" }}
          type: k8s
          namespace: {{ $disc.namespace | quote }}
          service_name: {{ $disc.serviceName | quote }}
          port: {{ $disc.port }}
          {{- else }}
          {{- fail (printf "tenantPools.overrides.%s.type must be static|k8s, got %q" $tenant $disc.type) }}
          {{- end }}
          {{- if and $.Values.backendToken.enabled (hasKey $.Values.backendToken.tenantOverrides $tenant) }}
          backend_token:
            kind: env
            name: {{ include "scg.backendTokenEnvName" $tenant }}
          {{- end }}
        {{- end }}
      {{- end }}

    {{- /* ---- tenant resolver ---- */}}
    tenant_resolver:
      {{- if eq .Values.tenantResolver.source "from_claim" }}
      source: from_claim
      {{- else if eq .Values.tenantResolver.source "from_metadata" }}
      source: from_metadata
      header: {{ .Values.tenantResolver.metadataHeader | quote }}
      {{- else if eq .Values.tenantResolver.source "always_default" }}
      source: always_default
      {{- else }}
      {{- fail (printf "tenantResolver.source must be from_claim|from_metadata|always_default, got %q" .Values.tenantResolver.source) }}
      {{- end }}
      on_missing: {{ .Values.tenantResolver.onMissing | quote }}
      default_name: {{ .Values.tenantResolver.defaultName | quote }}

    {{- /* ---- health-check ---- */}}
    {{- if .Values.healthCheck.enabled }}
    health_check:
      enabled: true
      interval_secs: {{ .Values.healthCheck.intervalSecs }}
      timeout_secs: {{ .Values.healthCheck.timeoutSecs }}
      unhealthy_threshold: {{ .Values.healthCheck.unhealthyThreshold }}
      healthy_threshold: {{ .Values.healthCheck.healthyThreshold }}
    {{- end }}

    {{- /* ---- audit logging ---- */}}
    audit:
      enabled: {{ .Values.audit.enabled }}
      log_successful_rpcs: {{ .Values.audit.logSuccessfulRpcs }}

    {{- /* ---- shutdown ---- */}}
    shutdown:
      deadline_secs: {{ .Values.shutdown.deadlineSecs }}

    {{- /* ---- tracing ---- */}}
    {{- if .Values.tracing.enabled }}
    tracing:
      endpoint: {{ .Values.tracing.endpoint | quote }}
      service_name: {{ .Values.tracing.serviceName | quote }}
      sample_ratio: {{ .Values.tracing.sampleRatio }}
      export_timeout_secs: {{ .Values.tracing.exportTimeoutSecs }}
    {{- end }}
