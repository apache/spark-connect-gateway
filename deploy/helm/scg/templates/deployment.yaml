apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scg.fullname" . }}
  labels:
    {{- include "scg.gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "scg.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods whenever the rendered config changes — without
        # this a `helm upgrade` that only flips a value in the
        # ConfigMap leaves the existing pods reading the old config.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "scg.gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Drain deadline + small buffer for the gRPC server to actually
      # close. If you raise `shutdown.deadlineSecs`, raise this too —
      # K8s SIGKILLs the pod when this elapses regardless of drain
      # progress.
      terminationGracePeriodSeconds: {{ add .Values.shutdown.deadlineSecs 10 }}
      serviceAccountName: {{ include "scg.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--config"
            - "/etc/scg/config.yaml"
          {{- if .Values.backendToken.enabled }}
          env:
            {{- if .Values.backendToken.secretName }}
            - name: SCG_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backendToken.secretName }}
                  key: {{ .Values.backendToken.secretKey | default "token" }}
            {{- end }}
            {{- range $tenant, $ref := .Values.backendToken.tenantOverrides }}
            - name: {{ include "scg.backendTokenEnvName" $tenant }}
              valueFrom:
                secretKeyRef:
                  name: {{ required (printf "backendToken.tenantOverrides.%s.secretName is required" $tenant) $ref.secretName }}
                  key: {{ $ref.secretKey | default "token" }}
            {{- end }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: admin
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: admin
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/scg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "scg.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
