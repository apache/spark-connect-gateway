[package]
name = "scg-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Prometheus metrics, OpenTelemetry tracing, and admin HTTP server for the Spark Connect Gateway."
publish = false

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
uuid = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }

[features]
# Enables `install_test_subscriber` — used by integration tests in
# downstream crates so they can observe spans via
# `opentelemetry_sdk::trace::InMemorySpanExporter` without each test
# binary respelling the wiring.
testing = ["opentelemetry_sdk/testing"]

[dev-dependencies]
opentelemetry-stdout = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }
futures = { workspace = true }
