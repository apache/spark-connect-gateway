# Configuration for `cargo audit`, run by .github/workflows/audit.yml.
#
# Every ignore below must name the issue that tracks removing it. An ignore
# without one tends to outlive the reason it was added.

[advisories]
ignore = [
    # RUSTSEC-2023-0071, rsa: Marvin Attack timing sidechannel on RSA
    # private-key operations. No fixed release exists. The gateway only
    # verifies RS256 signatures with public keys (via jsonwebtoken); every
    # private-key use is test-only. Tracked by SPARK-60369, which also lists
    # the conditions for removing this entry.
    "RUSTSEC-2023-0071",
]
